<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Tasks · UI5 Demo</title>
  <script id="sap-ui-bootstrap"
    src="https://sdk.openui5.org/1.120.0/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m"
    data-sap-ui-compat-version="edge"
    data-sap-ui-async="true"
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    data-sap-ui-resource-roots='{"demo.tasks": "./"}'></script>

<body class="sapUiBody" id="content">
  <div data-sap-ui-component data-name="demo.tasks" data-id="container" data-settings='{"id":"tasks"}'></div>

</html>
